events {
    worker_connections 1024;
}

http {
    # 1. Rate Limiting Zone: Limit requests to 20 per second per IP (Anti-DDoS)
    limit_req_zone $binary_remote_addr zone=litc_limit:10m rate=20r/s;

    # 2. Upstream Block: Distribute traffic across Node.js instances
    upstream litc_backend {
        # Round Robin Load Balancing (default)
        server node-app-1:3000;
        server node-app-2:3000;
    }

    server {
        listen 80;
        server_name localhost;

        # 3. Apply Rate Limiting to all requests
        limit_req zone=litc_limit burst=10 nodelay;

        # 4. Proxy Configuration
        location / {
            proxy_pass http://litc_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            
            # Forward real IP to Node.js for WAF and Logging
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 5. Error page for Rate Limit Exceeded (503 -> 429)
        error_page 503 = 429 /429.html;
        location = /429.html {
            default_type application/json;
            return 429 '{"error": "Too Many Requests. Rate limit exceeded. Please slow down."}';
        }
    }
}
