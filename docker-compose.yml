version: '3.8'

services:
  # 1. Nginx Reverse Proxy (Load Balancer & Rate Limiter)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - node-app-1
      - node-app-2
    networks:
      - litc-network

  # 2. Node.js Application (Instance 1)
  node-app-1:
    build: .
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=sqlserver://mssql:1433;database=litc_db;user=sa;password=YourStrongPassword123!;encrypt=true;trustServerCertificate=true;
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=admin123
      - SESSION_SECRET=LITC_SUPER_SECRET_PRODUCTION_KEY
    depends_on:
      - mssql
      - redis
      - minio
    networks:
      - litc-network

  # 3. Node.js Application (Instance 2)
  node-app-2:
    build: .
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=sqlserver://mssql:1433;database=litc_db;user=sa;password=YourStrongPassword123!;encrypt=true;trustServerCertificate=true;
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=admin
      - MINIO_SECRET_KEY=admin123
      - SESSION_SECRET=LITC_SUPER_SECRET_PRODUCTION_KEY
    depends_on:
      - mssql
      - redis
      - minio
    networks:
      - litc-network

  # 4. Redis (Distributed Session Store & Pub/Sub)
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - litc-network

  # 5. MinIO (S3-Compatible Object Storage for Attachments)
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=admin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - litc-network

  # 6. SQL Server (Current Database matching Prisma Schema)
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrongPassword123!
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      - litc-network

volumes:
  minio_data:
  mssql_data:

networks:
  litc-network:
    driver: bridge
